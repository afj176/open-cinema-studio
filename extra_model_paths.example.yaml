# Point ComfyUI at the Open Cinema models and custom nodes.
# Copy to extra_model_paths.yaml next to ComfyUI's main.py (or pass
# --extra-model-paths-config <this file>) and replace the example paths.
# Use absolute paths for your OS; forward slashes also work on Windows.
open_cinema:
  base_path: /absolute/path/to/models/open-cinema
  diffusion_models: diffusion_models
  text_encoders: text_encoders
  vae: vae
  latent_upscale_models: latent_upscale_models
  custom_nodes: /absolute/path/to/open-cinema-studio/custom_nodes
